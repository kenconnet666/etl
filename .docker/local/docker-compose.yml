# Local dev stack: source-pg + catalog-pg + rustfs + bucket-init
# Usage:
#   docker compose -f .docker/local/docker-compose.yml up -d
#   docker compose -f .docker/local/docker-compose.yml down -v   # teardown + wipe data
#
# Then run ETL replicator from WSL:
#   APP_ENVIRONMENT=local ./target/release/etl-replicator
#
# Passwords can be overridden via .env (copy from .env.example).

name: etl-local

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Source PostgreSQL — logical replication enabled, CDC role + publication created by initdb
  source-pg:
    build: ./postgres
    image: etl-local-pg18
    restart: unless-stopped
    logging: *logging
    shm_size: 128mb
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    ports:
      - "15432:5432"
    volumes:
      - source-pg-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 12

  # Catalog PostgreSQL — dedicated instance for DuckLake metadata
  catalog-pg:
    image: etl-local-pg18
    restart: unless-stopped
    logging: *logging
    depends_on:
      source-pg:
        condition: service_started
    environment:
      POSTGRES_USER: lake_admin
      POSTGRES_PASSWORD: ${CATALOG_PASSWORD:-changeme}
      POSTGRES_DB: ducklake_catalog
    ports:
      - "15434:5432"
    volumes:
      - catalog-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lake_admin -d ducklake_catalog"]
      interval: 5s
      retries: 12

  # S3-compatible object storage for Parquet data files
  rustfs:
    build: ./rustfs
    image: etl-local-rustfs
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
    ports:
      - "19000:9000"   # S3 API
      - "19001:9001"   # web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      retries: 12

  # One-shot: create the lake bucket after rustfs is healthy
  bucket-init:
    image: etl-local-rustfs
    logging: *logging
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://rustfs:9000 ${RUSTFS_ACCESS_KEY:-minioadmin} ${RUSTFS_SECRET_KEY:-minioadmin}
      && mc mb -p local/lake
      && echo 'bucket lake created'
      "
    restart: "no"

  # Doris frontend. The entrypoint requires IP addresses rather than hostnames,
  # and `priority_networks` must match the container network rather than
  # loopback, because under WSL2 loopback is namespaced per distribution and the
  # backend would never reach the frontend.
  doris-fe:
    image: ${DORIS_FE_IMAGE:-apache/doris:fe-4.1.3}
    restart: unless-stopped
    logging: *logging
    environment:
      FE_SERVERS: fe1:172.28.0.10:9010
      FE_ID: "1"
      priority_networks: 172.28.0.0/16
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "18030:8030"   # HTTP, used by Stream Load
      - "19030:9030"   # MySQL protocol, used for DDL
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8030/api/bootstrap || exit 1"]
      interval: 10s
      retries: 30

  # Doris backend. It registers itself with the frontend on first start.
  doris-be:
    image: ${DORIS_BE_IMAGE:-apache/doris:be-4.1.3}
    restart: unless-stopped
    logging: *logging
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      FE_SERVERS: fe1:172.28.0.10:9010
      BE_ADDR: 172.28.0.11:9050
      priority_networks: 172.28.0.0/16
    networks:
      default:
        ipv4_address: 172.28.0.11
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8040/api/health || exit 1"]
      interval: 10s
      retries: 30

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  source-pg-data:
  catalog-pg-data:
  rustfs-data:
  doris-fe-meta:
  doris-be-storage:
