# Build the task runner into its own target dir so alternating between
# `cargo x ...` and `cargo build`/`cargo run` stops invalidating shared crates.io
# deps whose unified feature sets differ between the two graphs.
[alias]
xtask = "run --target-dir target/xtask --package xtask --"
x = "run --quiet --target-dir target/xtask --package xtask --"

# Use lld linker for faster linking (1.5-2x faster than default ld)
# lld is part of the LLVM toolchain and widely available
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
# Link against the official prebuilt libduckdb instead of compiling the bundled
# DuckDB sources. The bundled build costs roughly ten minutes and 4.6 GB of
# object files per distinct build fingerprint, and `cargo build`, `cargo clippy`,
# and `cargo nextest` each own a different fingerprint. The archive is downloaded
# once into `<target-dir>/duckdb-download` and reused afterwards.
DUCKDB_DOWNLOAD_LIB = "1"
