[workspace]
resolver = "3"
members = [
    "crates/etl",
    "crates/etl-config",
    "crates/etl-destinations",
    "crates/etl-examples",
    "crates/etl-maintenance",
    "crates/etl-postgres",
    "crates/etl-replicator",
    "crates/etl-telemetry",
    "crates/xtask",
]

[workspace.package]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/supabase/etl"
homepage = "https://supabase.github.io/etl/"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# Correctness & safety
await_holding_lock = "deny"
clone_on_ref_ptr = "deny"
unused_async = "deny"
large_futures = "deny"

# Style & clarity
cloned_instead_of_copied = "warn"
copy_iterator = "warn"
dbg_macro = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
map_flatten = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_async_fn = "warn"
map_unwrap_or = "warn"
redundant_closure = "warn"
redundant_closure_call = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
redundant_clone = "warn"
redundant_field_names = "warn"
redundant_test_prefix = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
todo = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[workspace.dependencies]

anyhow = { version = "1.0.104", default-features = false }
async-trait = { version = "0.1.91" }
aws-lc-rs = { version = "1.17.3", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
byteorder = { version = "1.5.0", default-features = false }
bytes = { version = "1.12.1" }
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.4", default-features = false }
config = { version = "0.15", default-features = false }
configcat = { version = "0.1.5", default-features = false }
const-oid = { version = "0.10.2", default-features = false }
duckdb = { version = "1.10505.0", default-features = false }
etl = { path = "crates/etl", default-features = false }
etl-config = { path = "crates/etl-config", default-features = false }
etl-destinations = { path = "crates/etl-destinations", default-features = false }
etl-maintenance = { path = "crates/etl-maintenance", default-features = false }
etl-postgres = { path = "crates/etl-postgres", default-features = false }
etl-telemetry = { path = "crates/etl-telemetry", default-features = false }
fail = { version = "0.5.1", default-features = false }
futures = { version = "0.3.33", default-features = false }
hex = { version = "0.4", default-features = false }
humantime = { version = "2.4.0", default-features = false }
insta = { version = "1.48.0", default-features = false }
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
parking_lot = { version = "0.12.5" }
parse-size = { version = "1.1.0", default-features = false }
pg_escape = { version = "0.1.1", default-features = false }
pin-project-lite = { version = "0.2.17", default-features = false }
postgres-replication = { git = "https://github.com/iambriccardo/rust-postgres", default-features = false, rev = "31acf55c7e5c2244e5bb3a36e7afa2a01bf52c38" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
r2d2 = { version = "0.8", default-features = false }
rand = { version = "0.10.2", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
reqwest = { version = "0.13.4", default-features = false }
rust_decimal = { version = "1.42", default-features = false }
rustls = { version = "0.23.42", default-features = false }
secrecy = { version = "0.10.3", default-features = false }
sentry = { version = "0.48.5" }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
sqlx = { version = "0.9.0", default-features = false }
sysinfo = { version = "0.39.6", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.19"
tikv-jemalloc-ctl = { version = "0.7.0", default-features = false, features = ["stats"] }
tikv-jemallocator = { version = "0.7.0", default-features = false, features = ["background_threads_runtime_support", "unprefixed_malloc_on_supported_platforms"] }
tokio = { version = "1.53.1", default-features = false }
tokio-postgres = { git = "https://github.com/iambriccardo/rust-postgres", default-features = false, rev = "31acf55c7e5c2244e5bb3a36e7afa2a01bf52c38" }
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
tracing = { version = "0.1.44", default-features = false }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-log = { version = "0.2.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.5.0", default-features = false }
uuid = { version = "1.24.0", default-features = false }
x509-cert = { version = "0.3.0", default-features = false }

[profile.bench]
debug = true

[profile.release]
# Link-time optimization: enables better cross-crate optimizations
# "thin" provides ~80-90% of "fat" benefits with much faster compile times
lto = "thin"
# Default codegen-units for balanced build time and performance
codegen-units = 16
# Maximum optimization level for best runtime performance
opt-level = 3
