[package]
name = "etl-destinations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
autotests = false

rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
doctest = false

[features]
ducklake = [
    "dep:duckdb",
    "dep:etl-maintenance",
    "etl-maintenance/ducklake",
    "dep:humantime",
    "dep:metrics",
    "dep:parking_lot",
    "dep:pg_escape",
    "dep:r2d2",
    "dep:rand",
    "dep:regex",
    "dep:serde",
    "dep:serde_json",
    "dep:sqlx",
    "dep:tokio-postgres",
    "dep:tracing",
    "dep:tokio",
    "dep:url",
]
egress = ["etl/egress"]
# We assume that `test-utils` is always used in conjunction with a destination
# feature, so only the extra dependencies are listed here.
test-utils = ["dep:uuid"]

[dependencies]

chrono = { workspace = true, features = ["serde"] }
duckdb = { workspace = true, optional = true, features = ["appender-arrow", "r2d2", "rust_decimal"] }
etl = { workspace = true }
etl-config = { workspace = true }
etl-maintenance = { workspace = true, optional = true }
humantime = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
pg_escape = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true, features = ["thread_rng"] }
regex = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true, features = ["arbitrary_precision", "std"] }
sqlx = { workspace = true, optional = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
tokio-postgres = { workspace = true, optional = true }
tracing = { workspace = true, optional = true, default-features = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["v4"] }

[dev-dependencies]
chrono = { workspace = true }
etl = { workspace = true, features = ["test-utils"] }
etl-postgres = { workspace = true, features = ["test-utils", "tokio"] }
etl-telemetry = { workspace = true }
futures = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
rust_decimal = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs", "logging"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
