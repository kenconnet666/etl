# Development environment for the stack in `.docker/local`.
#
# Start it with:
#   docker compose -f .docker/local/docker-compose.yml up -d
#
# The credentials here match the compose defaults and are development-only.
# Override anything with `APP_`-prefixed environment variables, for example
# `APP_DESTINATION__DUCKLAKE__CATALOG_URL` or
# `APP_PIPELINE__PG_CONNECTION__PASSWORD`.
pipeline:
  id: 1
  publication_name: dbz_publication
  pg_connection:
    host: localhost
    port: 15432
    name: postgres
    username: postgres
    password: changeme
    tls:
      enabled: false
      trusted_root_certs: ""

destination:
  ducklake:
    catalog_url: postgres://lake_admin:changeme@localhost:15434/ducklake_catalog
    data_path: s3://lake/ducklake
    s3_access_key_id: minioadmin
    s3_secret_access_key: minioadmin
    s3_region: us-east-1
    s3_endpoint: localhost:19000
    s3_url_style: path
    s3_use_ssl: false
    maintenance_mode: postgres
